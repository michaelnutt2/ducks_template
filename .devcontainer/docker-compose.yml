services:
  app:
    # Example using Python; replace with Rust or C++ devcontainer image as needed
    image: mcr.microsoft.com/devcontainers/python:1-3.11
    volumes:
      # Maps the project folder into the container
      - ../:/workspaces:cached
    # Keeps the container running for the IDE to attach
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - ${PGADMIN_PORT}:8080
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
    depends_on:
      - postgres
volumes:
  postgres_data:
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "COSC 1301 Database",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
            }
          }
        }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:postgres:password
