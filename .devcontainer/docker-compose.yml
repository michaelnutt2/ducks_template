services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11
    volumes:
      - ../:/workspaces:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: "0400"
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: "0444"
    depends_on:
      postgres:
        condition: service_started
    environment:
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DEFAULT_EMAIL: student@cosc1301.local
      PGADMIN_DEFAULT_PASSWORD: password
      POSTGRES_DB: cosc1301
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
    ports:
      - "8080:80"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: cosc1301
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

configs:
  pgadmin-pgpass:
    content: |
      postgres:5432:*:postgres:password
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "COSC 1301 Database",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
            }
          }
        }